name: Release Production

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Promote staging to production
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout deployed staging commit
        uses: actions/checkout@v6
        with:
          ref: deploy-staging
          fetch-depth: 0
          persist-credentials: true

      - name: Validate release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"

          git fetch origin staging deploy-staging

          STAGING_SHA="$(git rev-parse origin/staging)"
          DEPLOYED_SHA="$(git rev-parse origin/deploy-staging)"

          if [[ "$SHA" != "$STAGING_SHA" ||
                "$SHA" != "$DEPLOYED_SHA" ]]; then
            echo "::error::Staging source and deployed commits differ."
            exit 1
          fi

          VERSION="$(jq -r '.version // empty' package.json)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid package.json version: $VERSION"
            exit 1
          fi

          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin \
            "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag ${TAG} already exists."
            exit 1
          fi

          RUN_ID="$(
            gh api \
              -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$SHA" \
              -f event=push \
              -f status=success \
              --jq '[.workflow_runs[]
                | select(
                    .head_branch == "staging" and
                    .conclusion == "success"
                  )
                | .id][0] // empty'
          )"

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::No successful staging CI run for $SHA."
            exit 1
          fi

          ARTIFACT_ID="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq \
              "[.artifacts[]
                | select(
                    .name == \"website-${SHA}\" and
                    .expired == false
                  )
                | .id][0] // empty"
          )"

          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "::error::Verified build artifact unavailable."
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Release: $TAG"
          echo "Commit: $SHA"
          echo "CI run: $RUN_ID"
          echo "Artifact: $ARTIFACT_ID"

      - name: Publish tag and promote production branch
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
          TAG: ${{ steps.candidate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" "$SHA" \
            -m "Release $TAG"

          # Atomic push: neither ref updates unless both succeed.
          # No force push: production must move forward.
          git push --atomic origin \
            "refs/tags/${TAG}" \
            "${SHA}:refs/heads/deploy-production"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.candidate.outputs.sha }}
          TAG: ${{ steps.candidate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            --verify-tag \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes
