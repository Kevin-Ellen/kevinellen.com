name: deploy prod

on:
  push:
    branches:
      - deploy-prod

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy-prod:
    name: Build release artifact and trigger PROD deployment in Spacelift
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_SHA="${GITHUB_SHA}"
          RELEASE_PREFIX="workers/${RELEASE_SHA}"

          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_key=${RELEASE_PREFIX}/worker-bundle.tar.gz" >> "$GITHUB_OUTPUT"
          echo "manifest_key=${RELEASE_PREFIX}/manifest.json" >> "$GITHUB_OUTPUT"
          echo "checksums_key=${RELEASE_PREFIX}/checksums.txt" >> "$GITHUB_OUTPUT"

          echo "Resolved deploy-prod release SHA: ${RELEASE_SHA}"
          echo "Resolved release key: ${RELEASE_PREFIX}/worker-bundle.tar.gz"

      - name: Set up Node 25
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build styles
        run: npm run build:styles

      - name: Build worker
        run: npm run build

      - name: Prepare release artifact package
        shell: bash
        run: |
          set -euo pipefail

          GIT_SHA="${{ steps.release.outputs.release_sha }}"
          RELEASE_KEY="${{ steps.release.outputs.release_key }}"
          BUILD_ID="${GITHUB_RUN_ID}"
          ARTIFACT_DIR=".artifact"
          PACKAGE_DIR="${ARTIFACT_DIR}/package"

          rm -rf "${ARTIFACT_DIR}"
          mkdir -p "${PACKAGE_DIR}/worker"

          cp dist/worker/entry.js "${PACKAGE_DIR}/worker/entry.js"
          cp dist/worker/entry.js.map "${PACKAGE_DIR}/worker/entry.js.map"

          if [ -d "dist/static" ]; then
            mkdir -p "${PACKAGE_DIR}/static"
            cp -R dist/static/. "${PACKAGE_DIR}/static/"
          fi

          cat > "${PACKAGE_DIR}/manifest.json" <<EOF_MANIFEST
          {
            "project": "kevinellen.com",
            "git_sha": "${GIT_SHA}",
            "build_id": "${BUILD_ID}",
            "worker_entry": "worker/entry.js",
            "static_dir": "static",
            "bundle_archive": "worker-bundle.tar.gz",
            "release_key": "${RELEASE_KEY}",
            "node_version": "25",
            "compatibility_date": "2026-03-12"
          }
          EOF_MANIFEST

          tar -czf "${ARTIFACT_DIR}/worker-bundle.tar.gz" -C "${PACKAGE_DIR}" .
          (
            cd "${ARTIFACT_DIR}"
            sha256sum "worker-bundle.tar.gz" | tee "checksums.txt"
          )

      - name: Upload release artifact to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          BUCKET="kevinellen-artifacts"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          python3 -m pip install --no-cache-dir awscli >/dev/null 2>&1

          python3 -m awscli s3 cp ".artifact/worker-bundle.tar.gz" \
            "s3://${BUCKET}/${{ steps.release.outputs.release_key }}" \
            --endpoint-url "${ENDPOINT}"

          python3 -m awscli s3 cp ".artifact/package/manifest.json" \
            "s3://${BUCKET}/${{ steps.release.outputs.manifest_key }}" \
            --endpoint-url "${ENDPOINT}"

          python3 -m awscli s3 cp ".artifact/checksums.txt" \
            "s3://${BUCKET}/${{ steps.release.outputs.checksums_key }}" \
            --endpoint-url "${ENDPOINT}"

      - name: Show deploy inputs
        shell: bash
        run: |
          echo "stack_id=${{ vars.SPACELIFT_PROD_STACK_ID }}"
          echo "release_sha=${{ steps.release.outputs.release_sha }}"
          echo "release_key=${{ steps.release.outputs.release_key }}"

      - name: Verify release artifact exists
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUCKET="kevinellen-artifacts"

          python3 -m awscli s3 ls \
            "s3://${BUCKET}/${{ steps.release.outputs.release_key }}" \
            --endpoint-url "${ENDPOINT}" >/dev/null

          echo "Release artifact exists: ${{ steps.release.outputs.release_key }}"

      - name: Trigger PROD run via Spacelift GraphQL
        env:
          SPACELIFT_API_KEY_ENDPOINT: ${{ vars.SPACELIFT_API_KEY_ENDPOINT }}
          SPACELIFT_API_KEY_ID: ${{ secrets.SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ secrets.SPACELIFT_API_KEY_SECRET }}
          SPACELIFT_PROD_STACK_ID: ${{ vars.SPACELIFT_PROD_STACK_ID }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_KEY: ${{ steps.release.outputs.release_key }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${SPACELIFT_API_KEY_ENDPOINT:-}" || { echo "SPACELIFT_API_KEY_ENDPOINT is not set"; exit 1; }
          test -n "${SPACELIFT_API_KEY_ID:-}" || { echo "SPACELIFT_API_KEY_ID is not set"; exit 1; }
          test -n "${SPACELIFT_API_KEY_SECRET:-}" || { echo "SPACELIFT_API_KEY_SECRET is not set"; exit 1; }
          test -n "${SPACELIFT_PROD_STACK_ID:-}" || { echo "SPACELIFT_PROD_STACK_ID is not set"; exit 1; }
          test -n "${RELEASE_SHA:-}" || { echo "RELEASE_SHA is not set"; exit 1; }
          test -n "${RELEASE_KEY:-}" || { echo "RELEASE_KEY is not set"; exit 1; }

          sudo apt-get update >/dev/null 2>&1
          sudo apt-get install -y jq >/dev/null 2>&1

          JWT="$(
            curl -sS \
              -X POST "${SPACELIFT_API_KEY_ENDPOINT}/graphql" \
              -H "Content-Type: application/json" \
              --data "{\"query\":\"mutation GetSpaceliftToken(\$id: ID!, \$secret: String!) { apiKeyUser(id: \$id, secret: \$secret) { jwt } }\",\"variables\":{\"id\":\"${SPACELIFT_API_KEY_ID}\",\"secret\":\"${SPACELIFT_API_KEY_SECRET}\"}}" \
            | jq -r '.data.apiKeyUser.jwt'
          )"

          test -n "${JWT}" || { echo "Failed to obtain JWT"; exit 1; }
          test "${JWT}" != "null" || { echo "JWT was null"; exit 1; }

          echo "JWT acquired"

          PAYLOAD="$(cat <<EOF_PAYLOAD
          {
            "query": "mutation RunTrigger(\$stack: ID!, \$commitSha: String!, \$runtimeConfig: RuntimeConfigInput) { runTrigger(stack: \$stack, commitSha: \$commitSha, runtimeConfig: \$runtimeConfig) { id } }",
            "variables": {
              "stack": "${SPACELIFT_PROD_STACK_ID}",
              "commitSha": "${RELEASE_SHA}",
              "runtimeConfig": {
                "environment": [
                  {
                    "key": "TF_VAR_release_sha",
                    "value": "${RELEASE_SHA}"
                  },
                  {
                    "key": "TF_VAR_release_key",
                    "value": "${RELEASE_KEY}"
                  },
                  {
                    "key": "TF_VAR_worker_script_path",
                    "value": "/mnt/workspace/.artifact/releases/${RELEASE_SHA}/worker/entry.js"
                  },
                  {
                    "key": "TF_VAR_static_dir",
                    "value": "/mnt/workspace/.artifact/releases/${RELEASE_SHA}/static"
                  }
                ]
              }
            }
          }
          EOF_PAYLOAD
          )"

          RESPONSE="$(
            curl -sS \
              -X POST "${SPACELIFT_API_KEY_ENDPOINT}/graphql" \
              -H "Authorization: Bearer ${JWT}" \
              -H "Content-Type: application/json" \
              --data "${PAYLOAD}"
          )"

          echo "${RESPONSE}"

          if printf '%s' "${RESPONSE}" | jq -e '.errors != null' >/dev/null; then
            echo "GraphQL returned errors:"
            printf '%s' "${RESPONSE}" | jq '.errors'
            exit 1
          fi

          RUN_ID="$(printf '%s' "${RESPONSE}" | jq -r '.data.runTrigger.id')"

          test -n "${RUN_ID}" || { echo "Failed to extract run ID"; exit 1; }
          test "${RUN_ID}" != "null" || { echo "Run ID was null"; exit 1; }

          echo "Triggered Spacelift run: ${RUN_ID}"
