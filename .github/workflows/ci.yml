name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Validate website
    runs-on: ubuntu-24.04

    needs:
      - secrets-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run styles:lint

      - name: Tests with coverage
        run: npm run test:coverage -- --ci --watch=false

      - name: Build website
        run: npm run build

      - name: Upload deployment artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: website-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  notify-spacelift:
    name: Notify Spacelift
    runs-on: ubuntu-24.04

    needs:
      - secrets-scan
      - validate

    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/staging'
      }}

    steps:
      - name: Install spacectl
        uses: spacelift-io/setup-spacectl@main

      - name: Report CI result
        env:
          SPACELIFT_API_KEY_ENDPOINT: https://kevin-ellen.app.spacelift.io
          SPACELIFT_API_KEY_ID: ${{ secrets.SPACELIFT_API_KEY_ID }}
          SPACELIFT_API_KEY_SECRET: ${{ secrets.SPACELIFT_API_KEY_SECRET }}
          SECRETS_RESULT: ${{ needs.secrets-scan.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}

        shell: bash
        run: |
          if [[ "$SECRETS_RESULT" == "success" &&
                "$VALIDATE_RESULT" == "success" ]]; then
            STATUS="finished"
          else
            STATUS="failed"
          fi

          spacectl run-external-dependency mark-completed \
            --id "${GITHUB_SHA}-website-ci" \
            --status "$STATUS"

          echo "Reported ${STATUS} for ${GITHUB_SHA}"
