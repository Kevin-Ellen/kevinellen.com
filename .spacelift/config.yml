version: "2"

stack_defaults: &defaults
  project_root: deployments
  terraform_workflow_tool: OPEN_TOFU
  opentofu_version: "1.13.9"

  before_init:
    - "git rev-parse --show-toplevel"
    - 'cd "$(git rev-parse --show-toplevel)" && bash scripts/deploy/setup-node.sh'
    - "/tmp/spacelift-node/bin/node --version"
    - 'PATH="/tmp/spacelift-node/bin:$PATH" /tmp/spacelift-node/bin/npm ci --prefix "$(git rev-parse --show-toplevel)"'
    - 'cd "$(git rev-parse --show-toplevel)" && PATH="/tmp/spacelift-node/bin:$PATH" npm run build'

  before_apply:
    - 'cd "$(git rev-parse --show-toplevel)" && bash scripts/deploy/setup-node.sh'
    - "/tmp/spacelift-node/bin/node --version"
    - "/tmp/spacelift-node/bin/npm --version"
    - 'PATH="/tmp/spacelift-node/bin:$PATH" /tmp/spacelift-node/bin/npm ci --prefix "$(git rev-parse --show-toplevel)"'
    - 'cd "$(git rev-parse --show-toplevel)" && PATH="/tmp/spacelift-node/bin:$PATH" npm run build'

stacks:
  staging:
    <<: *defaults
    environment:
      TF_VAR_environment: staging

  production:
    <<: *defaults
    environment:
      TF_VAR_environment: production
