version: "2"

stack_defaults: &defaults
  project_root: deployments

  opentofu:
    version: "1.13.9"
    workflow_tool: OPENTOFU

  before_init:
    - 'bash "$(git rev-parse --show-toplevel)/scripts/deploy/fetch-artifact.sh"'

  before_apply:
    - 'bash "$(git rev-parse --show-toplevel)/scripts/deploy/fetch-artifact.sh"'

stacks:
  staging:
    <<: *defaults
    environment:
      TF_VAR_environment: staging

  production:
    <<: *defaults
    environment:
      TF_VAR_environment: production
